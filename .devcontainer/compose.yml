name: leaseboard

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    # Mount the repo's parent at /workspaces, as the official Compose templates do
    # (devcontainers/templates src/postgres). With "Clone Repository in Container
    # Volume" the extension mounts its volume at /workspaces, and only this form
    # lines up with it (microsoft/vscode-remote-release#5388). In Codespaces the
    # repo is cloned to /workspaces/<repo> on the VM, so the same line works there.
    volumes:
      - ../..:/workspaces:cached
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  db:
    # Render managed Postgres offers majors 13-18 (not 19); match the newest.
    image: postgres:18.7
    restart: unless-stopped
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    # From Postgres 18 the image keeps data under /var/lib/postgresql/<major>/,
    # so the volume mounts the parent directory.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
