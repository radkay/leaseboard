# Render Blueprint for Leaseboard — admin (Rails), board (Phoenix), one Postgres.
#
# This file is written but NOT applied. Ron creates the Blueprint from it in the
# morning (see docs/DEPLOY.md), sets every `sync: false` secret by hand, seeds the
# database once, and imports the Sanity content.
#
# Keep all three resources in the SAME region so the board's reads and the admin's
# writes stay on a local network to the database.

databases:
  - name: leaseboard-db
    plan: free # see the free-tier note at the bottom of this file
    region: oregon
    postgresMajorVersion: "18"

services:
  # --- admin (Rails, the only writer) --------------------------------------
  # Native Ruby runtime. Commands and variables come from apps/admin/DEPLOY.md
  # (Agent A owns the admin; this Blueprint just wires it up).
  - type: web
    name: leaseboard-admin
    runtime: ruby
    plan: free
    region: oregon
    rootDir: apps/admin
    buildCommand: "SECRET_KEY_BASE_DUMMY=1 bin/rails assets:precompile"
    # Runs on every deploy, before the new version takes traffic. db:migrate also
    # provisions the read-only board_reader role, which needs BOARD_READER_PASSWORD.
    preDeployCommand: "bin/rails db:migrate"
    startCommand: "bin/rails server"
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      # The owner connection string, straight from the managed database.
      - key: DATABASE_URL
        fromDatabase:
          name: leaseboard-db
          property: connectionString
      # Secrets — set by hand in the dashboard (see docs/DEPLOY.md).
      - key: SECRET_KEY_BASE
        sync: false
      - key: BOARD_READER_PASSWORD # shared with the board's DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional — Sanity content for the public listing page. Unset ⇒ fallback copy.
      - key: SANITY_PROJECT_ID
        sync: false
      - key: SANITY_DATASET
        sync: false
      - key: SANITY_API_VERSION
        sync: false

  # --- board (Phoenix, read-only) ------------------------------------------
  # Docker runtime: apps/board/Dockerfile (mix phx.gen.release --docker). Paths are
  # relative to rootDir.
  - type: web
    name: leaseboard-board
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/board
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # The board_reader connection string — NOT fromDatabase (that would be the
      # owner). Ron builds it from the database's host/name plus the board_reader
      # user and BOARD_READER_PASSWORD (see docs/DEPLOY.md).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      # The board's own hostname; check_origin and the canonical URL use it.
      - key: PHX_HOST
        sync: false
    # Render injects PORT and the board's runtime.exs binds to it — don't set it here.

# --- Free-tier note (question for Ron) -------------------------------------
# All three resources are on `free` so the whole stack can run at no cost. Trade-offs:
#   * Free web services sleep after ~15 minutes idle; the first request then takes
#     ~30s to wake. The board's live updates still work once awake.
#   * Free Postgres is removed ~30 days after creation and is capped at 1GB.
# For a persistent demo, upgrade `leaseboard-db` (and optionally the services) to the
# Starter tier. Left on free pending Ron's call — see the PR.
