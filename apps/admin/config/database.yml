# PostgreSQL. All databases, owner roles and reader roles are defined in
# docs/CONTRACT.md's Environments table and created by db/bootstrap (as the
# `postgres` superuser) — never here and never by a migration. Rails connects as
# the environment's owner role; no app ever connects as `postgres`.
#
# Passwords come from the environment (never committed). `reader_role` is a custom
# key (not a connection parameter) read by db:privileges to grant the reader.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  # For details on connection pooling, see the Rails configuration guide:
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: leaseboard_dev
  username: admin_dev
  password: <%= ENV["ADMIN_DEV_PASSWORD"] %>
  reader_role: reader_dev

# Warning: The database defined as "test" will be erased and re-generated from your
# development database when you run "rake". Do not set this db to the same as
# development or production.
test:
  <<: *default
  database: leaseboard_test
  username: admin_test
  password: <%= ENV["ADMIN_TEST_PASSWORD"] %>
  reader_role: reader_test

# Render supplies DATABASE_URL (the admin_prod owner connection). reader_prod is
# created by Ron with SQL before the first deploy (CONTRACT.md); db:privileges
# grants it on every release.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  reader_role: reader_prod
